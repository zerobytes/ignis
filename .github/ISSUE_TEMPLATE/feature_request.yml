name: Feature proposal
description: Describe a concrete use case and an observable result.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build?
      description: Explain the problem and any current workaround.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and scope
      description: Include how a human and an MCP client would use it. Small, testable proposals are easier to review.
    validations:
      required: true
