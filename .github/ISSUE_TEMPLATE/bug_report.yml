name: Bug report
description: Report a reproducible problem in the engine or setup.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for trying Ignis. Check existing issues first. For security problems, use private reporting.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/architecture, GPU/backend if relevant, rustc --version, and commit SHA.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      description: Exact commands, minimal scene or input, and steps from a clean checkout. Remove secrets and personal paths.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or capture
      description: Include the first error. A screenshot helps visual bugs; please avoid unrelated personal information.
